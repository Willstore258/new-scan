<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewScan - Universal QR Code Scanner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HTML5-QRCode Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Styling area kamera scanner */
        #reader {
            width: 100% !important;
            border: none !important;
            border-radius: 1rem;
            overflow: hidden;
            background: #000;
        }

        #reader video {
            object-fit: cover !important;
            border-radius: 1rem;
        }

        /* Line scanner animation */
        .scan-laser {
            position: absolute;
            left: 5%;
            width: 90%;
            height: 3px;
            background: linear-gradient(90deg, rgba(59,130,246,0) 0%, #3b82f6 50%, rgba(59,130,246,0) 100%);
            box-shadow: 0 0 15px #3b82f6, 0 0 8px #60a5fa;
            animation: scanAnim 2.2s infinite ease-in-out;
            z-index: 10;
        }

        @keyframes scanAnim {
            0% { top: 10%; opacity: 0.2; }
            50% { top: 85%; opacity: 1; }
            100% { top: 10%; opacity: 0.2; }
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto relative shadow-2xl bg-slate-950 pb-20">

    <!-- Header App -->
    <header class="p-4 glass sticky top-0 z-50 flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide text-white">New<span class="text-blue-500">Scan</span></h1>
                <p class="text-xs text-slate-400">Scanner QR & QRIS Pintar</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="btn-file" onclick="document.getElementById('file-input').click()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all text-sm border border-slate-700" title="Upload dari galeri">
                <i class="fa-solid fa-image"></i>
            </button>
            <input type="file" id="file-input" accept="image/*" class="hidden">
            <button id="btn-toggle-camera" onclick="switchCamera()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all text-sm border border-slate-700" title="Ganti Kamera">
                <i class="fa-solid fa-camera-rotate"></i>
            </button>
        </div>
    </header>

    <!-- Main Body Container -->
    <main class="p-4 flex-1 flex flex-col gap-4">

        <!-- Scanner Viewfinder Box -->
        <div class="relative w-full rounded-2xl overflow-hidden glass p-2 border border-slate-800 shadow-2xl">
            <!-- Frame Animasi Laser -->
            <div id="scan-frame" class="relative overflow-hidden rounded-xl bg-black min-h-[300px] flex items-center justify-center">
                <!-- Laser Line -->
                <div id="laser" class="scan-laser hidden"></div>
                
                <!-- Corner Overlays -->
                <div class="absolute top-4 left-4 w-8 h-8 border-t-4 border-l-4 border-blue-500 rounded-tl-lg z-20 pointer-events-none"></div>
                <div class="absolute top-4 right-4 w-8 h-8 border-t-4 border-r-4 border-blue-500 rounded-tr-lg z-20 pointer-events-none"></div>
                <div class="absolute bottom-4 left-4 w-8 h-8 border-b-4 border-l-4 border-blue-500 rounded-bl-lg z-20 pointer-events-none"></div>
                <div class="absolute bottom-4 right-4 w-8 h-8 border-b-4 border-r-4 border-blue-500 rounded-br-lg z-20 pointer-events-none"></div>

                <!-- HTML5 QrCode Target Video Container -->
                <div id="reader"></div>

                <!-- Placeholder Status Jika Kamera Mati -->
                <div id="scanner-placeholder" class="text-center p-6 flex flex-col items-center gap-3">
                    <i class="fa-solid fa-camera text-4xl text-slate-600"></i>
                    <p class="text-sm text-slate-400">Menyiapkan kamera belakang...</p>
                    <button onclick="startScanner()" class="mt-2 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold shadow-md">
                        Mulai Kamera
                    </button>
                </div>
            </div>

            <!-- Custom Controls Under Scanner -->
            <div class="flex items-center justify-between mt-3 px-2 text-xs text-slate-400">
                <span id="camera-status"><i class="fa-solid fa-circle text-green-500 text-[10px] mr-1"></i> Kamera Belakang Aktif</span>
                <button onclick="toggleTorch()" id="btn-torch" class="hidden text-slate-300 hover:text-white flex items-center gap-1">
                    <i class="fa-solid fa-bolt"></i> Flash
                </button>
            </div>
        </div>

        <!-- Scan Result Modal / Card Container -->
        <div id="result-card" class="hidden glass rounded-2xl p-5 border border-blue-500/30 shadow-2xl bg-slate-900/90 transition-all duration-300">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                <div class="flex items-center gap-2" id="result-type-badge">
                    <!-- Dynamic Badge Generated by JS -->
                </div>
                <button onclick="closeResult()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Result Dynamic Payload Area -->
            <div id="result-content" class="space-y-3">
                <!-- Content injected via JS -->
            </div>

            <!-- Action Buttons -->
            <div class="mt-4 pt-3 border-t border-slate-800/80 flex gap-2" id="result-actions">
                <!-- Actions injected via JS -->
            </div>
        </div>

        <!-- History Section -->
        <div class="glass rounded-2xl p-4 border border-slate-800 flex-1 flex flex-col">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-blue-400"></i> Riwayat Pemindaian
                </h2>
                <button onclick="clearHistory()" class="text-xs text-slate-500 hover:text-rose-400 transition-colors">
                    Hapus
                </button>
            </div>
            
            <div id="history-list" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                <p class="text-xs text-slate-500 text-center py-6">Belum ada riwayat pemindaian.</p>
            </div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-blue-600 text-white text-xs px-4 py-2.5 rounded-full shadow-xl opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2">
        <i class="fa-solid fa-check-circle"></i>
        <span id="toast-msg">Pesan toast</span>
    </div>

    <!-- Script Implementation -->
    <script>
        let html5QrCode = null;
        let currentCameraId = null;
        let availableCameras = [];
        let isScanning = false;
        let torchOn = false;

        // Load History from LocalStorage
        let scanHistory = JSON.parse(localStorage.getItem('newscan_history') || '[]');

        window.onload = function () {
            initScanner();
            renderHistory();

            // Handle Image Upload
            document.getElementById('file-input').addEventListener('change', function(e) {
                if (e.target.files.length === 0) return;
                const imageFile = e.target.files[0];
                
                if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

                showToast("Memproses gambar...");
                html5QrCode.scanFile(imageFile, true)
                    .then(decodedText => {
                        onScanSuccess(decodedText, null);
                    })
                    .catch(err => {
                        showToast("Gagal membaca QR Code dari gambar.");
                        console.error(err);
                    });
            });
        };

        // Inisialisasi Kamera Belakang
        function initScanner() {
            Html5Qrcode.getCameras().then(cameras => {
                availableCameras = cameras;
                if (cameras && cameras.length > 0) {
                    // Cari kamera belakang (environment)
                    let backCamera = cameras.find(cam => 
                        cam.label.toLowerCase().includes('back') || 
                        cam.label.toLowerCase().includes('belakang') ||
                        cam.label.toLowerCase().includes('rear') ||
                        cam.label.toLowerCase().includes('environment')
                    );

                    // Jika tidak ditemukan, gunakan kamera terakhir di list (biasanya kamera utama/belakang di ponsel)
                    currentCameraId = backCamera ? backCamera.id : cameras[cameras.length - 1].id;
                    startScanner(currentCameraId);
                } else {
                    document.getElementById('scanner-placeholder').innerHTML = `
                        <i class="fa-solid fa-triangle-exclamation text-amber-500 text-3xl mb-2"></i>
                        <p class="text-xs text-slate-400">Kamera tidak ditemukan pada perangkat ini.</p>
                    `;
                }
            }).catch(err => {
                console.error("Camera access error:", err);
                document.getElementById('scanner-placeholder').innerHTML = `
                    <i class="fa-solid fa-lock text-rose-500 text-3xl mb-2"></i>
                    <p class="text-xs text-slate-400">Izin kamera ditolak. Berikan izin di pengaturan browser Anda.</p>
                `;
            });
        }

        // Jalankan Scanner
        function startScanner(cameraId = null) {
            if (isScanning) return;

            document.getElementById('scanner-placeholder').classList.add('hidden');
            document.getElementById('laser').classList.remove('hidden');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = { 
                fps: 15, 
                qrbox: { width: 220, height: 220 },
                aspectRatio: 1.0
            };

            const cameraConstraint = cameraId ? { deviceId: { exact: cameraId } } : { facingMode: "environment" };

            html5QrCode.start(
                cameraConstraint, 
                config, 
                onScanSuccess, 
                onScanFailure
            ).then(() => {
                isScanning = true;
                // Cek fitur flash
                try {
                    const capabilities = html5QrCode.getRunningTrackCapabilities();
                    if (capabilities.torch) {
                        document.getElementById('btn-torch').classList.remove('hidden');
                    }
                } catch(e) {}
            }).catch(err => {
                console.error("Start Scanner Error:", err);
                isScanning = false;
                document.getElementById('laser').classList.add('hidden');
                document.getElementById('scanner-placeholder').classList.remove('hidden');
            });
        }

        // Hentikan Scanner sementara
        function stopScanner() {
            if (html5QrCode && isScanning) {
                return html5QrCode.stop().then(() => {
                    isScanning = false;
                    document.getElementById('laser').classList.add('hidden');
                });
            }
            return Promise.resolve();
        }

        // Ganti Kamera
        function switchCamera() {
            if (availableCameras.length <= 1) {
                showToast("Hanya 1 kamera terdeteksi");
                return;
            }

            stopScanner().then(() => {
                let currentIndex = availableCameras.findIndex(c => c.id === currentCameraId);
                let nextIndex = (currentIndex + 1) % availableCameras.length;
                currentCameraId = availableCameras[nextIndex].id;
                startScanner(currentCameraId);
                showToast("Mengganti kamera...");
            });
        }

        // Flash Light Toggle
        function toggleTorch() {
            if (html5QrCode && isScanning) {
                torchOn = !torchOn;
                html5QrCode.applyVideoConstraints({
                    advanced: [{ torch: torchOn }]
                }).then(() => {
                    document.getElementById('btn-torch').classList.toggle('text-amber-400', torchOn);
                });
            }
        }

        // Callback Saat QR Berhasil Di-scan
        function onScanSuccess(decodedText, decodedResult) {
            // Efek suara / Haptic Feedback jika tersedia
            if (navigator.vibrate) navigator.vibrate(100);

            // Tampilkan hasil
            parseAndDisplayQR(decodedText);

            // Tambahkan ke riwayat
            addToHistory(decodedText);
        }

        function onScanFailure(error) {
            // Abaikan kesalahan scanning per frame
        }

        // ==========================================
        // PARSER & PENGENAL QR CODE (URL, QRIS, DLL)
        // ==========================================
        function parseAndDisplayQR(data) {
            const resultCard = document.getElementById('result-card');
            const badgeArea = document.getElementById('result-type-badge');
            const contentArea = document.getElementById('result-content');
            const actionsArea = document.getElementById('result-actions');

            resultCard.classList.remove('hidden');

            // 1. Deteksi Pembayaran (QRIS / EMVCo Standard)
            if (data.includes("000201") || data.toLowerCase().includes("qris") || data.includes("NMID")) {
                const parsedQRIS = parseQRIS(data);
                
                badgeArea.innerHTML = `
                    <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5">
                        <i class="fa-solid fa-money-bill-wave"></i> QRIS / Pembayaran
                    </span>
                `;

                contentArea.innerHTML = `
                    <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/60 space-y-2">
                        <div class="flex justify-between items-start border-b border-slate-700/60 pb-2">
                            <div>
                                <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Merchant / Toko</p>
                                <h3 class="text-base font-bold text-white">${parsedQRIS.merchantName || 'Merchant QRIS'}</h3>
                                <p class="text-xs text-slate-400">${parsedQRIS.merchantCity || ''}</p>
                            </div>
                            <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono">
                                IDR
                            </span>
                        </div>

                        <div class="pt-1">
                            <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Nominal Transaksi</p>
                            <div class="text-2xl font-extrabold text-emerald-400 font-mono mt-0.5">
                                ${parsedQRIS.amount ? 'Rp ' + Number(parsedQRIS.amount).toLocaleString('id-ID') : '<span class="text-slate-400 text-sm font-normal">Nominal Fleksibel (Input Manual)</span>'}
                            </div>
                        </div>

                        ${parsedQRIS.nmid ? `
                        <div class="pt-1 border-t border-slate-700/40 text-xs text-slate-400 flex justify-between">
                            <span>NMID:</span>
                            <span class="font-mono text-slate-300">${parsedQRIS.nmid}</span>
                        </div>` : ''}
                    </div>
                `;

                actionsArea.innerHTML = `
                    <button onclick="copyToClipboard('${escapeQuotes(data)}')" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl transition-all flex items-center justify-center gap-2">
                        <i class="fa-regular fa-copy"></i> Salin Raw QRIS
                    </button>
                `;
            }
            // 2. Deteksi Link / URL
            else if (isValidURL(data)) {
                let formattedUrl = data.startsWith('http') ? data : 'https://' + data;

                badgeArea.innerHTML = `
                    <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30 flex items-center gap-1.5">
                        <i class="fa-solid fa-link"></i> Tautan / Link
                    </span>
                `;

                contentArea.innerHTML = `
                    <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/60 space-y-1">
                        <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">URL Terditeksi</p>
                        <a href="${formattedUrl}" target="_blank" class="text-sm font-medium text-blue-400 hover:underline break-all block">
                            ${data}
                        </a>
                    </div>
                `;

                actionsArea.innerHTML = `
                    <a href="${formattedUrl}" target="_blank" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Buka Tautan
                    </a>
                    <button onclick="copyToClipboard('${escapeQuotes(data)}')" class="py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl transition-all">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                `;
            }
            // 3. Deteksi Wi-Fi
            else if (data.startsWith('WIFI:')) {
                const wifiData = parseWifi(data);

                badgeArea.innerHTML = `
                    <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-purple-500/20 text-purple-400 border border-purple-500/30 flex items-center gap-1.5">
                        <i class="fa-solid fa-wifi"></i> Jaringan Wi-Fi
                    </span>
                `;

                contentArea.innerHTML = `
                    <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/60 space-y-2">
                        <div>
                            <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Nama SSID / Wi-Fi</p>
                            <p class="text-base font-bold text-white">${wifiData.ssid || '-'}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Kata Sandi / Password</p>
                            <p class="text-sm font-mono text-purple-300 bg-slate-900/60 px-2.5 py-1.5 rounded border border-slate-800 select-all">${wifiData.password || '(Tanpa Password)'}</p>
                        </div>
                    </div>
                `;

                actionsArea.innerHTML = `
                    <button onclick="copyToClipboard('${escapeQuotes(wifiData.password)}')" class="flex-1 py-2.5 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-xl transition-all flex items-center justify-center gap-2">
                        <i class="fa-regular fa-copy"></i> Salin Password
                    </button>
                `;
            }
            // 4. Text biasa atau Format Lain
            else {
                badgeArea.innerHTML = `
                    <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-700 text-slate-300 border border-slate-600 flex items-center gap-1.5">
                        <i class="fa-solid fa-align-left"></i> Teks Biasa
                    </span>
                `;

                contentArea.innerHTML = `
                    <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/60">
                        <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider mb-1">Isi Konten</p>
                        <p class="text-sm text-slate-200 whitespace-pre-wrap break-all font-mono">${escapeHtml(data)}</p>
                    </div>
                `;

                actionsArea.innerHTML = `
                    <button onclick="copyToClipboard('${escapeQuotes(data)}')" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl transition-all flex items-center justify-center gap-2">
                        <i class="fa-regular fa-copy"></i> Salin Teks
                    </button>
                `;
            }
        }

        // Parser Sederhana Spesifikasi EMVCo QRIS
        function parseQRIS(qrString) {
            let res = {
                merchantName: "",
                merchantCity: "",
                amount: null,
                nmid: ""
            };

            try {
                let index = 0;
                while (index < qrString.length) {
                    let id = qrString.substring(index, index + 2);
                    let length = parseInt(qrString.substring(index + 2, index + 4), 10);
                    let value = qrString.substring(index + 4, index + 4 + length);

                    if (isNaN(length)) break;

                    // ID 54: Transaction Amount
                    if (id === "54") {
                        res.amount = value;
                    }
                    // ID 59: Merchant Name
                    else if (id === "59") {
                        res.merchantName = value;
                    }
                    // ID 60: Merchant City
                    else if (id === "60") {
                        res.merchantCity = value;
                    }
                    // ID 26-51: Merchant Information (Extract NMID if present)
                    else if (parseInt(id) >= 26 && parseInt(id) <= 51) {
                        if (value.includes("NMID") || value.includes("ID")) {
                            let nmidMatch = value.match(/ID\d+/);
                            if (nmidMatch) res.nmid = nmidMatch[0];
                        }
                    }

                    index += 4 + length;
                }
            } catch (e) {
                console.error("QRIS Parsing error:", e);
            }

            return res;
        }

        // Helper Helper Parser WiFi
        function parseWifi(data) {
            let ssid = (data.match(/S:([^;]+)/) || [])[1] || "";
            let password = (data.match(/P:([^;]+)/) || [])[1] || "";
            let type = (data.match(/T:([^;]+)/) || [])[1] || "";
            return { ssid, password, type };
        }

        // Validasi URL
        function isValidURL(string) {
            try {
                let url = string.startsWith('http') ? string : 'https://' + string;
                let parsed = new URL(url);
                return parsed.hostname.includes('.');
            } catch (_) {
                return false;
            }
        }

        // Manajemen Riwayat (History)
        function addToHistory(text) {
            // Hindari duplikat berturut-turut
            if (scanHistory.length > 0 && scanHistory[0].text === text) return;

            const newItem = {
                text: text,
                time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                date: new Date().toLocaleDateString('id-ID')
            };

            scanHistory.unshift(newItem);
            if (scanHistory.length > 20) scanHistory.pop(); // Max 20 history item

            localStorage.setItem('newscan_history', JSON.stringify(scanHistory));
            renderHistory();
        }

        function renderHistory() {
            const listEl = document.getElementById('history-list');

            if (scanHistory.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">Belum ada riwayat pemindaian.</p>`;
                return;
            }

            listEl.innerHTML = scanHistory.map((item, index) => {
                let icon = 'fa-align-left';
                let color = 'text-slate-400';

                if (item.text.includes("000201") || item.text.toLowerCase().includes("qris")) {
                    icon = 'fa-money-bill-wave';
                    color = 'text-emerald-400';
                } else if (isValidURL(item.text)) {
                    icon = 'fa-link';
                    color = 'text-blue-400';
                } else if (item.text.startsWith('WIFI:')) {
                    icon = 'fa-wifi';
                    color = 'text-purple-400';
                }

                return `
                    <div onclick="parseAndDisplayQR('${escapeQuotes(item.text)}')" class="p-2.5 rounded-xl bg-slate-800/40 hover:bg-slate-800 border border-slate-800/80 cursor-pointer transition-all flex items-center justify-between gap-3 group">
                        <div class="flex items-center gap-2.5 overflow-hidden">
                            <i class="fa-solid ${icon} ${color} text-sm"></i>
                            <span class="text-xs text-slate-300 truncate font-mono">${escapeHtml(item.text)}</span>
                        </div>
                        <span class="text-[10px] text-slate-500 whitespace-nowrap">${item.time}</span>
                    </div>
                `;
            }).join('');
        }

        function clearHistory() {
            scanHistory = [];
            localStorage.removeItem('newscan_history');
            renderHistory();
            showToast("Riwayat dihapus");
        }

        function closeResult() {
            document.getElementById('result-card').classList.add('hidden');
        }

        function copyToClipboard(text) {
            const tempInput = document.createElement("textarea");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            showToast("Teks berhasil disalin!");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/\n/g, "\\n");
        }
    </script>
</body>
</html>
